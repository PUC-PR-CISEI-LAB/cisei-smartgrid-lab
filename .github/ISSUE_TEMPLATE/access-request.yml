name: Solicitação de acesso
description: Pedido de acesso aos repositórios privados do CISEI Smart Grid Lab
title: "[acesso] "
labels: ["access-request"]
body:
  - type: markdown
    attributes:
      value: |
        A conta GitHub que abre esta solicitação é a identidade usada no laboratório; o convite será enviado a ela.
        Esta *issue* é pública: **não informe nome completo, e-mail, telefone, documentos ou qualquer outro dado pessoal.** O vínculo é confirmado pela coordenação do laboratório por canal institucional.
  - type: dropdown
    id: access-role
    attributes:
      label: Papel pretendido
      options:
        - Pesquisador(a) — executa experimentos e contribui com código, dados ou documentação
        - Leitor(a) — acompanha, revisa e estuda o material, sem executar experimentos
    validations:
      required: true
  - type: dropdown
    id: affiliation
    attributes:
      label: Vínculo
      options:
        - Estudante de pós-graduação (mestrado/doutorado)
        - Estudante de iniciação científica / graduação
        - Docente / pesquisador PUC-PR
        - Parceiro externo (acordo institucional)
    validations:
      required: true
  - type: textarea
    id: justification
    attributes:
      label: Justificativa
      description: Uso pretendido do laboratório (3–5 linhas). Estudantes indicam o(a) orientador(a).
    validations:
      required: true
